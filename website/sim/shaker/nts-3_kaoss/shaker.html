<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>logue-sdk XY pad</title>
  <script src="./coi-serviceworker.js"></script>
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Space Grotesk', sans-serif;
      -webkit-font-smoothing: subpixel-antialiased;
    }
  </style>
</head>

<body>
  <button id="TogglePlaybackButton">Start audio</button>
  <h2>Master Volume</h2>
  <input type="range" min="0" max="1" value="0.5" step="0.01" id="VolumeSlider">
  <span id="VolumeLabel"></span>

  <h2>BPM</h2>
  <input type="range" min="30" max="240" value="120" step="0.1" id="BpmSlider">
  <span id="BpmLabel"></span>

  <h2>Dry Input</h2>
  <p>Use samples or a test oscillator as dry input for the effect.</p>
  <select id="OscillatorType">
    <option value="sawtooth">Sawtooth</option>
    <option value="square">Square</option>
    <option value="triangle">Triangle</option>
    <option value="sine">Sine</option>
    <option value="noise">Noise</option>
  </select>
  <button id="TestToneButton">Test Tone Off</button>

  <h2>Sample</h2>
  <div id="Samples"></div>

  <h2>Scope</h2>
  <canvas id="TimeDomain" width="512" height="128"></canvas><br />
  <canvas id="FrequencyDomain" width="512" height="128"></canvas>

  <h2>Depth &amp; XY Pad
    <button id="XYPadHold" style="margin-left: 10px;">Hold Off</button>
  </h2>

  <div style="display: flex; align-items: center; gap: 30px;">
    <input type="range" min="0" max="1" value="0.5" step="0.0001" id="DepthSlider"
      style="writing-mode: vertical-lr; height: 240px; direction: rtl; margin-left: 20px;">

    <canvas id="XYPad" width="360" height="240" style="border:2px solid #000;"></canvas>
  </div>

  <h2>Parameters</h2>
  <div id="Parameters"></div>

  <script>
    window.__simDryInput = {
      context: null,
      mixGain: null,
      connectedSamples: new WeakSet(),
    };

    window.connectSampleToDryInput = function (audioElement) {
      const dryInput = window.__simDryInput;
      if (!dryInput.context || !dryInput.mixGain) {
        return;
      }
      if (dryInput.connectedSamples.has(audioElement)) {
        return;
      }
      const source = dryInput.context.createMediaElementSource(audioElement);
      source.connect(dryInput.mixGain);
      dryInput.connectedSamples.add(audioElement);
    };

    fetch("samples/samples.json")
      .then((response) => response.json())
      .then((samples) => {
        const samplesDiv = document.getElementById("Samples");

        samples.forEach((sample) => {
          const container = document.createElement("div");

          const label = document.createElement("label");
          label.textContent = sample.name;
          label.style.display = "block";
          container.appendChild(label);

          const audio = document.createElement("audio");
          audio.controls = true;
          audio.src = `samples/${sample.file}`;
          container.appendChild(audio);

          samplesDiv.appendChild(container);
          window.connectSampleToDryInput(audio);
        });
      })
      .catch((error) => {
        console.error("Failed to load sandbox samples:", error);
      });

    window.setupWebAudioAndUI = function (context, wasmProcessor) {
      const AHREnvelopeTime = 0.1;

      function approximatelyEqual(a, b, epsilon = 1e-4) {
        return Math.abs(a - b) < epsilon;
      }

      function createSlider(wasmProcessor, param, mapping, index) {
        const container = document.createElement("div");

        const label = document.createElement("label");
        label.textContent = param.name.toLowerCase();
        label.style.display = "inline-block";
        label.style.width = "100px";
        label.style.marginRight = "10px";
        container.appendChild(label);

        const paramSlider = document.createElement("input");
        paramSlider.type = "range";
        paramSlider.min = param.min;
        paramSlider.max = param.max;
        paramSlider.step = 1;
        paramSlider.value = param.init;
        paramSlider.id = param.name;
        paramSlider.style.width = "200px";
        paramSlider.style.marginRight = "10px";
        container.appendChild(paramSlider);

        const valueString = document.createElement("span");
        valueString.textContent = Module.getParameterValueString(index, paramSlider.value);
        container.appendChild(valueString);

        const audioParameter = wasmProcessor.parameters.get(`${index}`);

        paramSlider.oninput = () => {
          valueString.textContent = Module.getParameterValueString(index, paramSlider.value);
          audioParameter.value = paramSlider.value;
        };

        document.getElementById("Parameters").appendChild(container);

        if (mapping.assign === Module.ParamAssign.X) {
          const xyPad = document.getElementById("XYPad");
          paramSlider.value = mapping.init;

          function updateXParamFromXYPad(event) {
            if (event.buttons !== 1) {
              return;
            }
            const rect = xyPad.getBoundingClientRect();
            const xNormalized = Math.min(Math.max(event.clientX - rect.left, 0), xyPad.width) / xyPad.width;
            const curved0to1 = Module.applyCurveToParameter0to1(xNormalized, mapping.curve, mapping.unipolar);
            paramSlider.value = curved0to1 * (mapping.max - mapping.min) + mapping.min;
            paramSlider.dispatchEvent(new Event("input"));
          }

          xyPad.addEventListener("mousemove", updateXParamFromXYPad);
          xyPad.addEventListener("mousedown", updateXParamFromXYPad);
        } else if (mapping.assign === Module.ParamAssign.Y) {
          const xyPad = document.getElementById("XYPad");
          paramSlider.value = mapping.init;

          function updateYParamFromXYPad(event) {
            if (event.buttons !== 1) {
              return;
            }
            const rect = xyPad.getBoundingClientRect();
            const yNormalized = 1.0 - Math.min(Math.max(event.clientY - rect.top, 0), xyPad.height) / xyPad.height;
            const curved0to1 = Module.applyCurveToParameter0to1(yNormalized, mapping.curve, mapping.unipolar);
            paramSlider.value = curved0to1 * (mapping.max - mapping.min) + mapping.min;
            paramSlider.dispatchEvent(new Event("input"));
          }

          xyPad.addEventListener("mousemove", updateYParamFromXYPad);
          xyPad.addEventListener("mousedown", updateYParamFromXYPad);
        } else if (mapping.assign === Module.ParamAssign.Depth) {
          const depthSlider = document.getElementById("DepthSlider");
          paramSlider.value = mapping.init;

          depthSlider.addEventListener("input", () => {
            const curvedParameter = Module.applyCurveToParameter0to1(depthSlider.value, mapping.curve, mapping.unipolar);
            paramSlider.value = curvedParameter * (mapping.max - mapping.min) + mapping.min;
            paramSlider.dispatchEvent(new Event("input"));
          });
        }
      }

      const oscillator = new OscillatorNode(context, { frequency: 440.0 });
      const envelope = new GainNode(context, { gain: 0.0 });
      const volume = new GainNode(context, { gain: 0.1 });
      const analyser = new AnalyserNode(context, { fftSize: 4096 });
      const data = new Float32Array(analyser.frequencyBinCount);
      const mixGain = new GainNode(context, { gain: 1.0 });

      const noise = new AudioBufferSourceNode(context, { loop: true });
      noise.buffer = context.createBuffer(1, context.sampleRate, context.sampleRate);
      for (let sampleIndex = 0; sampleIndex < context.sampleRate; sampleIndex++) {
        noise.buffer.getChannelData(0)[sampleIndex] = 2 * Math.random() - 1;
      }

      oscillator.connect(envelope).connect(mixGain);
      mixGain.connect(wasmProcessor).connect(volume);
      volume.connect(analyser);
      volume.connect(context.destination);

      window.__simDryInput.context = context;
      window.__simDryInput.mixGain = mixGain;

      const samplesDiv = document.getElementById("Samples");
      const audioElements = samplesDiv.getElementsByTagName("audio");
      for (const audioElement of audioElements) {
        window.connectSampleToDryInput(audioElement);
      }

      let audioSourcesStarted = false;
      const togglePlaybackButton = document.getElementById("TogglePlaybackButton");

      function ensureAudioRunning() {
        if (context.state !== "running") {
          context.resume();
        }
        if (!audioSourcesStarted) {
          oscillator.start();
          noise.start();
          audioSourcesStarted = true;
        }
        togglePlaybackButton.innerText = "Suspend audio";
      }

      togglePlaybackButton.onclick = () => {
        if (context.state !== "running") {
          ensureAudioRunning();
        } else {
          context.suspend();
          togglePlaybackButton.innerText = "Start audio";
        }
      };

      const volumeSlider = document.getElementById("VolumeSlider");
      const volumeLabel = document.getElementById("VolumeLabel");
      volume.gain.value = volumeSlider.value;
      volumeLabel.innerText = volumeSlider.value;
      volumeSlider.oninput = function () {
        volume.gain.linearRampToValueAtTime(this.value, context.currentTime + 0.1);
        volumeLabel.innerText = this.value;
      };

      const bpmSlider = document.getElementById("BpmSlider");
      const bpmLabel = document.getElementById("BpmLabel");
      bpmLabel.innerText = bpmSlider.value;
      bpmSlider.oninput = function () {
        bpmLabel.innerText = this.value;
        Module.fx_set_bpm(this.value);
      };

      const oscType = document.getElementById("OscillatorType");
      oscillator.type = oscType.value;

      oscType.onchange = function () {
        if (this.value === "noise") {
          noise.connect(envelope);
          oscillator.disconnect(envelope);
        } else {
          oscillator.type = this.value;
          oscillator.connect(envelope);
          noise.disconnect(envelope);
        }
      };

      let testToneEnabled = false;
      const testToneButton = document.getElementById("TestToneButton");
      testToneButton.onclick = function () {
        ensureAudioRunning();
        testToneEnabled = !testToneEnabled;
        this.innerText = `Test Tone ${testToneEnabled ? "On" : "Off"}`;
        envelope.gain.cancelAndHoldAtTime(context.currentTime);
        envelope.gain.linearRampToValueAtTime(
          testToneEnabled ? 1.0 : 0.0,
          context.currentTime + AHREnvelopeTime,
        );
      };

      const canvasWave = document.getElementById("TimeDomain");
      const canvasFFT = document.getElementById("FrequencyDomain");
      const canvasWaveContext = canvasWave.getContext("2d");
      const canvasFFTContext = canvasFFT.getContext("2d");

      function draw() {
        analyser.getFloatTimeDomainData(data);

        canvasWaveContext.fillStyle = "rgb(255, 255, 255)";
        canvasWaveContext.fillRect(0, 0, canvasWave.width, canvasWave.height);
        canvasWaveContext.lineWidth = 1;
        canvasWaveContext.strokeStyle = "rgb(0, 0, 0)";
        canvasWaveContext.beginPath();

        let startIndex = 0;
        let scoreMax = 0.0;
        const dx = Math.floor(400 / oscillator.frequency.value) + 1;

        for (let sampleIndex = dx; sampleIndex < data.length / 2; ++sampleIndex) {
          if ((data[sampleIndex - 1] > 0) && (data[sampleIndex + 1] < 0)) {
            const score = (data[sampleIndex - dx] - data[sampleIndex + dx]) - data[sampleIndex + 5 * dx];
            if (score > scoreMax) {
              scoreMax = score;
              startIndex = sampleIndex;
            }
          }
        }

        let numHalfCycles = Math.floor(analyser.fftSize * oscillator.frequency.value / context.sampleRate) - 1;
        let endIndex = data.length - 1;
        if (numHalfCycles > 0) {
          endIndex = Math.round(startIndex + numHalfCycles * context.sampleRate / oscillator.frequency.value / 2);
        }

        let deltaX = canvasWave.width / (endIndex - startIndex);
        let x = 0;

        for (let sampleIndex = startIndex; sampleIndex <= endIndex; sampleIndex++) {
          const value = data[sampleIndex];
          const y = (value * 0.5 + 1.0) * canvasWave.height / 2;

          if (sampleIndex === startIndex) {
            canvasWaveContext.moveTo(x, y);
          } else {
            canvasWaveContext.lineTo(x, y);
          }

          x += deltaX;
        }
        canvasWaveContext.stroke();

        analyser.getFloatFrequencyData(data);
        canvasFFTContext.clearRect(0, 0, canvasFFT.width, canvasFFT.height);

        const fftDeltaX = canvasFFT.width / data.length;
        let posX = 0;
        for (let binIndex = 0; binIndex < data.length; binIndex++) {
          const barHeight = data[binIndex] + canvasFFT.height;
          canvasFFTContext.fillStyle = "rgb(0, 0, 0)";
          canvasFFTContext.fillRect(
            posX,
            canvasFFT.height - barHeight,
            fftDeltaX,
            barHeight,
          );
          posX += fftDeltaX;
        }
        requestAnimationFrame(draw);
      }
      draw();

      const xyPad = document.getElementById("XYPad");
      const holdButton = document.getElementById("XYPadHold");
      let xyPadHold = false;
      let lastXYPadEvent = { clientX: 0, clientY: 0 };
      holdButton.onclick = function () {
        xyPadHold = !xyPadHold;
        this.innerText = `Hold ${xyPadHold ? "On" : "Off"}`;

        if (!xyPadHold) {
          updateXYPad(lastXYPadEvent, Module.TouchEvent.Ended);
        }
      };

      function updateXYPad(event, phase) {
        lastXYPadEvent = event;
        const rect = xyPad.getBoundingClientRect();
        const x = Math.min(Math.max(event.clientX - rect.left, 0), xyPad.width);
        const y = Math.min(Math.max(event.clientY - rect.top, 0), xyPad.height);

        Module.touchEvent(phase, x / xyPad.width, y / xyPad.height);

        const ctx = xyPad.getContext("2d");
        ctx.clearRect(0, 0, xyPad.width, xyPad.height);
        if (phase !== Module.TouchEvent.Ended) {
          ctx.beginPath();
          ctx.arc(x, y, 10, 0, 2 * Math.PI);
          ctx.fillStyle = "lightblue";
          ctx.fill();
        }
      }

      xyPad.addEventListener("mousedown", function (event) {
        ensureAudioRunning();
        updateXYPad(event, Module.TouchEvent.Began);
      });

      xyPad.addEventListener("mousemove", function (event) {
        if (event.buttons !== 1) {
          return;
        }
        updateXYPad(event, Module.TouchEvent.Moved);
      });

      document.addEventListener("mouseup", function (event) {
        if (!xyPadHold) {
          updateXYPad(event, Module.TouchEvent.Ended);
        }
      });

      const parameters = Module.getValidParameters();
      const mappings = Module.getDefaultMapping();
      for (let paramIndex = 0; paramIndex < parameters.size(); ++paramIndex) {
        createSlider(
          wasmProcessor,
          parameters.get(paramIndex),
          mappings.get(paramIndex),
          paramIndex,
        );
      }
    };
    window.Module = Object.assign(window.Module || {}, {
      onAudioReady: window.setupWebAudioAndUI,
    });
  </script>

  <script async type="text/javascript" src="shaker.js"></script>
</body>

</html>
