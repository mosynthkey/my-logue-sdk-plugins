name: Build and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SysEx packing tests
        run: node tests/nts1-midi.test.mjs
      - name: Run plugin category tests
        run: node tests/plugin-category.test.mjs

  # Classify PR diffs so website-only / docs-only PRs skip heavy native/wasm work.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      native: ${{ steps.filter.outputs.native }}
      website: ${{ steps.filter.outputs.website }}
      mk2: ${{ steps.filter.outputs.mk2 }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            native:
              - 'plugins/**'
              - 'Makefile'
              - 'third_party/**'
              - 'scripts/**'
              - '.github/workflows/**'
            website:
              - 'website/**'
              - 'scripts/build-website.sh'
            mk2:
              - 'plugins/**/targets/microkorg2/**'
              - 'third_party/logue-sdk/platform/microkorg2/**'
              - 'plugins/hypersaw/**'
              - 'plugins/fbackosc/**'

  # Frontend smoke for website-only PRs (no unit/wasm rebuild).
  website-smoke:
    if: >
      github.event_name == 'pull_request' &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.website == 'true' &&
      needs.changes.outputs.native != 'true'
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build website frontend only
        working-directory: website
        run: |
          npm ci
          npm run build

  build:
    # Push/dispatch: always. PR: only when native paths changed.
    # always() so a skipped `changes` job on push does not skip build.
    if: >
      always() &&
      (github.event_name != 'pull_request' ||
       (needs.changes.result == 'success' && needs.changes.outputs.native == 'true'))
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Init CMSIS submodule only
        run: git -C third_party/logue-sdk submodule update --init platform/ext/CMSIS

      - name: Cache ARM GNU toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gcc-arm-none-eabi
          key: gcc-arm-none-eabi-10.3-2021.10-x86_64-linux

      - name: Install ARM GNU toolchain 10.3-2021.10
        working-directory: ${{ runner.temp }}
        run: |
          TOOLCHAIN_BIN="${{ runner.temp }}/gcc-arm-none-eabi/bin"
          if [ ! -x "$TOOLCHAIN_BIN/arm-none-eabi-gcc" ]; then
            if curl -fL -o gcc-arm.tar.bz2 \
              https://developer.arm.com/-/media/Files/downloads/gnu-rm/10.3-2021.10/gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2; then
              tar -xjf gcc-arm.tar.bz2
              mv gcc-arm-none-eabi-10.3-2021.10 gcc-arm-none-eabi
            else
              sudo apt-get update
              sudo apt-get install -y gcc-arm-none-eabi
              TOOLCHAIN_BIN=/usr/bin
            fi
          fi
          echo "GCC_BIN_PATH=$TOOLCHAIN_BIN" >> "$GITHUB_ENV"

      - name: Cache microKORG2 toolchain
        if: hashFiles('plugins/*/targets/microkorg2/Makefile') != ''
        uses: actions/cache@v4
        with:
          path: third_party/logue-sdk/tools/microkorg2-toolchain
          key: microkorg2-toolchain-drumlogue-amd64

      - name: Install microKORG2 toolchain (when needed)
        if: hashFiles('plugins/*/targets/microkorg2/Makefile') != ''
        run: |
          MK2_ROOT="third_party/logue-sdk/tools/microkorg2-toolchain"
          if [ ! -x "$MK2_ROOT/arm-unknown-linux-gnueabihf/bin/arm-unknown-linux-gnueabihf-gcc" ]; then
            mkdir -p "$MK2_ROOT"
            curl -fL -o /tmp/mk2-toolchain.tar.bz2 \
              "https://www.dropbox.com/s/3curhjx9yip29os/drumlogue-toolchain-amd64.tar.bz2?dl=1"
            tar -xjf /tmp/mk2-toolchain.tar.bz2 -C "$MK2_ROOT" --strip-components=1
          fi

      - name: Build units
        run: make unit GCC_BIN_PATH="$GCC_BIN_PATH"

      - name: Build microKORG2 waves reference
        if: github.event_name != 'pull_request' || needs.changes.outputs.mk2 == 'true'
        run: |
          MK2_PREFIX="$PWD/third_party/logue-sdk/tools/microkorg2-toolchain/arm-unknown-linux-gnueabihf/bin/arm-unknown-linux-gnueabihf-"
          make -C third_party/logue-sdk/platform/microkorg2/waves clean
          make -C third_party/logue-sdk/platform/microkorg2/waves all \
            CROSS_COMPILE="$MK2_PREFIX"

      - name: Build HyperSaw dependency diagnostics
        if: github.event_name != 'pull_request' || needs.changes.outputs.mk2 == 'true'
        run: |
          MK2_PREFIX="$PWD/third_party/logue-sdk/tools/microkorg2-toolchain/arm-unknown-linux-gnueabihf/bin/arm-unknown-linux-gnueabihf-"
          mkdir -p microkorg2-diagnostics
          cp plugins/hypersaw/targets/microkorg2/hypersaw.mk2unit microkorg2-diagnostics/
          cp plugins/fbackosc/targets/microkorg2/fbackosc.mk2unit microkorg2-diagnostics/
          for level in 1 2 3; do
            make -C plugins/hypersaw/targets/microkorg2 clean \
              PROJECT="hypersaw-diag${level}"
            make -C plugins/hypersaw/targets/microkorg2 all \
              CROSS_COMPILE="$MK2_PREFIX" \
              PROJECT="hypersaw-diag${level}" \
              UDEFS="-Dwt_saw_notes=osc_wt_saw_notes -Dwt_saw_lut_f=osc_wt_saw_lut_f -Dwt_sqr_lut_f=osc_wt_sqr_lut_f -DHYPERSAW_DIAGNOSTIC=${level}"
            cp "plugins/hypersaw/targets/microkorg2/build/hypersaw-diag${level}.mk2unit" \
              microkorg2-diagnostics/
          done

      - name: Compare microKORG2 ELF binaries
        if: github.event_name != 'pull_request' || needs.changes.outputs.mk2 == 'true'
        run: |
          MK2_READELF="$PWD/third_party/logue-sdk/tools/microkorg2-toolchain/arm-unknown-linux-gnueabihf/bin/arm-unknown-linux-gnueabihf-readelf"
          cp third_party/logue-sdk/platform/microkorg2/waves/build/waves.mk2unit \
            microkorg2-diagnostics/
          for unit in microkorg2-diagnostics/*.mk2unit; do
            report="microkorg2-diagnostics/$(basename "$unit").readelf.txt"
            {
              echo "===== $unit ====="
              "$MK2_READELF" -h -l -S -d -A -r --dyn-syms "$unit"
            } > "$report"
          done
          sha256sum microkorg2-diagnostics/*.mk2unit \
            > microkorg2-diagnostics/SHA256SUMS

      - name: Upload microKORG2 diagnostics
        if: github.event_name != 'pull_request' || needs.changes.outputs.mk2 == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: microkorg2-diagnostics
          path: microkorg2-diagnostics/
          if-no-files-found: error

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74
          actions-cache-folder: emsdk-cache
          cache-key: emsdk-3.1.74-linux-x64

      - name: Build Wasm simulator
        run: make wasm EMCC_BIN_PATH="$(dirname "$(command -v emcc)")"

      - name: Setup Node.js
        if: github.event_name != 'pull_request'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build deployable website
        if: github.event_name != 'pull_request'
        run: bash scripts/build-website.sh dist/website

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/website

  # Always-present aggregate for branch protection (skipped jobs are OK).
  ci-result:
    if: always()
    needs: [test, changes, website-smoke, build]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required jobs
        run: |
          echo "test=${{ needs.test.result }}"
          echo "changes=${{ needs.changes.result }}"
          echo "website-smoke=${{ needs.website-smoke.result }}"
          echo "build=${{ needs.build.result }}"
          test "${{ needs.test.result }}" = "success"
          case "${{ needs.build.result }}" in success|skipped) ;; *) exit 1 ;; esac
          case "${{ needs.website-smoke.result }}" in success|skipped) ;; *) exit 1 ;; esac
          case "${{ needs.changes.result }}" in success|skipped) ;; *) exit 1 ;; esac

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
