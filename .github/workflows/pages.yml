name: Build and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run SysEx packing tests
        run: node tests/nts1-midi.test.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Init CMSIS submodule only
        run: git -C third_party/logue-sdk submodule update --init platform/ext/CMSIS

      - name: Cache ARM GNU toolchain
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gcc-arm-none-eabi
          key: gcc-arm-none-eabi-10.3-2021.10-x86_64-linux

      - name: Install ARM GNU toolchain 10.3-2021.10
        working-directory: ${{ runner.temp }}
        run: |
          TOOLCHAIN_BIN="${{ runner.temp }}/gcc-arm-none-eabi/bin"
          if [ ! -x "$TOOLCHAIN_BIN/arm-none-eabi-gcc" ]; then
            if curl -fL -o gcc-arm.tar.bz2 \
              https://developer.arm.com/-/media/Files/downloads/gnu-rm/10.3-2021.10/gcc-arm-none-eabi-10.3-2021.10-x86_64-linux.tar.bz2; then
              tar -xjf gcc-arm.tar.bz2
              mv gcc-arm-none-eabi-10.3-2021.10 gcc-arm-none-eabi
            else
              sudo apt-get update
              sudo apt-get install -y gcc-arm-none-eabi
              TOOLCHAIN_BIN=/usr/bin
            fi
          fi
          echo "GCC_BIN_PATH=$TOOLCHAIN_BIN" >> "$GITHUB_ENV"

      - name: Install microKORG2 toolchain (when needed)
        if: hashFiles('plugins/*/targets/microkorg2/Makefile') != ''
        run: |
          MK2_ROOT="third_party/logue-sdk/tools/microkorg2-toolchain"
          if [ ! -x "$MK2_ROOT/arm-unknown-linux-gnueabihf/bin/arm-unknown-linux-gnueabihf-gcc" ]; then
            mkdir -p "$MK2_ROOT"
            curl -fL -o /tmp/mk2-toolchain.tar.bz2 \
              https://www.dropbox.com/s/3curhjx9yip29os/drumlogue-toolchain-amd64.tar.bz2
            tar -xjf /tmp/mk2-toolchain.tar.bz2 -C "$MK2_ROOT" --strip-components=1
          fi

      - name: Build units
        run: make unit GCC_BIN_PATH="$GCC_BIN_PATH"

      - name: Build microKORG2 waves reference
        run: |
          MK2_PREFIX="$PWD/third_party/logue-sdk/tools/microkorg2-toolchain/arm-unknown-linux-gnueabihf/bin/arm-unknown-linux-gnueabihf-"
          make -C third_party/logue-sdk/platform/microkorg2/waves clean
          make -C third_party/logue-sdk/platform/microkorg2/waves all \
            CROSS_COMPILE="$MK2_PREFIX"

      - name: Build HyperSaw dependency diagnostics
        run: |
          MK2_PREFIX="$PWD/third_party/logue-sdk/tools/microkorg2-toolchain/arm-unknown-linux-gnueabihf/bin/arm-unknown-linux-gnueabihf-"
          mkdir -p microkorg2-diagnostics
          cp plugins/hypersaw/targets/microkorg2/hypersaw.mk2unit microkorg2-diagnostics/
          cp plugins/fbackosc/targets/microkorg2/fbackosc.mk2unit microkorg2-diagnostics/
          for level in 1 2 3; do
            make -C plugins/hypersaw/targets/microkorg2 clean \
              PROJECT="hypersaw-diag${level}"
            make -C plugins/hypersaw/targets/microkorg2 all \
              CROSS_COMPILE="$MK2_PREFIX" \
              PROJECT="hypersaw-diag${level}" \
              UDEFS="-Dwt_saw_notes=osc_wt_saw_notes -Dwt_saw_lut_f=osc_wt_saw_lut_f -Dwt_sqr_lut_f=osc_wt_sqr_lut_f -DHYPERSAW_DIAGNOSTIC=${level}"
            cp "plugins/hypersaw/targets/microkorg2/build/hypersaw-diag${level}.mk2unit" \
              microkorg2-diagnostics/
          done

      - name: Compare microKORG2 ELF binaries
        run: |
          MK2_READELF="$PWD/third_party/logue-sdk/tools/microkorg2-toolchain/arm-unknown-linux-gnueabihf/bin/arm-unknown-linux-gnueabihf-readelf"
          cp third_party/logue-sdk/platform/microkorg2/waves/build/waves.mk2unit \
            microkorg2-diagnostics/
          for unit in microkorg2-diagnostics/*.mk2unit; do
            report="microkorg2-diagnostics/$(basename "$unit").readelf.txt"
            {
              echo "===== $unit ====="
              "$MK2_READELF" -h -l -S -d -A -r --dyn-syms "$unit"
            } > "$report"
          done
          sha256sum microkorg2-diagnostics/*.mk2unit \
            > microkorg2-diagnostics/SHA256SUMS

      - name: Upload microKORG2 diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: microkorg2-diagnostics
          path: microkorg2-diagnostics/
          if-no-files-found: error

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.74

      - name: Build Wasm simulator
        run: make wasm EMCC_BIN_PATH="$(dirname "$(command -v emcc)")"

      - name: Assemble GitHub Pages site
        run: bash scripts/assemble-site.sh site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [test, build]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
