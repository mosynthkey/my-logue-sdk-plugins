<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logue SDK Plugins</title>
  <meta name="description" content="logue SDK plugins — preview and send to NTS-1 mkII or NTS-3.">
  <script>
    const coepCredentiallessSupported = typeof CSS !== "undefined"
      && CSS.supports("cross-origin-embedder-policy", "credentialless");
    window.coi = {
      coepCredentialless: () => coepCredentiallessSupported,
      coepDegrade: () => !coepCredentiallessSupported,
      quiet: true,
    };
  </script>
  <script src="./coi-serviceworker.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Unbounded:wght@700;800&display=swap" rel="stylesheet" crossorigin>
</head>
<body>
  <div id="app"></div>
  <script src="./vendor/qwerty-hancock.js"></script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
