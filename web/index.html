<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plugins</title>
  <meta name="description" content="logue SDK plugins.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="mast">
    <p class="kicker">logue SDK</p>
    <h1>Plugins</h1>
    <p class="lede">Send to NTS-1 mkII over USB, or download the unit.</p>
    <p class="notice">Under construction. Still being tested.</p>
  </header>

  <main class="layout">
    <section class="panel units" aria-labelledby="units-heading">
      <div class="panel__label">Units</div>
      <h2 id="units-heading" class="visually-hidden">Units</h2>
      <div id="plugin-list" class="plugin-list"></div>
    </section>
  </main>

  <div id="send-modal" class="modal" hidden>
    <div class="modal__backdrop" data-close-modal></div>
    <div class="modal__dialog" role="dialog" aria-modal="true" aria-labelledby="send-modal-title">
      <header class="modal__header">
        <div>
          <p class="kicker">Send to NTS-1 mkII</p>
          <h2 id="send-modal-title">Plugin</h2>
        </div>
        <button type="button" class="modal__close" data-close-modal aria-label="Close">×</button>
      </header>

      <div id="midi-unsupported" class="modal__notice" hidden>
        <p>Chrome or Edge required for MIDI. Download the unit otherwise.</p>
      </div>

      <div id="midi-panel">
        <p id="device-status" class="status" data-kind="idle">Looking for NTS-1 mkII…</p>

        <label class="field">
          <span>Output</span>
          <select id="midi-output"></select>
        </label>
        <label class="field">
          <span>Input</span>
          <select id="midi-input"></select>
        </label>
        <div class="field-row">
          <label class="field">
            <span>Channel</span>
            <input id="channel" type="number" min="1" max="16" value="1">
          </label>
          <label class="field">
            <span id="slot-label">Slot</span>
            <select id="slot"></select>
          </label>
        </div>
        <p class="hint">If two NTS-1 ports appear, use the last one.</p>

        <div class="modal__actions">
          <button type="button" class="button button-secondary" data-close-modal>Cancel</button>
          <button type="button" class="button button-primary" id="send">Send to slot</button>
        </div>
      </div>

      <div class="log-wrap">
        <h3>Log</h3>
        <div id="log" class="log" role="log" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <script src="./coi-serviceworker.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
