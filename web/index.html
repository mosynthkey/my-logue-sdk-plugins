<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plugins</title>
  <meta name="description" content="logue SDK plugins.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <header class="mast">
    <p class="kicker">logue SDK</p>
    <h1>Plugins</h1>
    <p class="lede">Send to NTS-1 mkII over USB, or download the unit.</p>
    <p class="notice">Under construction. Still being tested.</p>
  </header>

  <main class="layout">
    <section class="panel midi" aria-labelledby="midi-heading">
      <div class="panel__label">MIDI</div>
      <h2 id="midi-heading">NTS-1 mkII</h2>
      <p id="midi-status" class="status" data-kind="idle">Connect over USB-C.</p>

      <div id="midi-unsupported" hidden>
        <p>Chrome or Edge required for MIDI. Download the unit otherwise.</p>
      </div>

      <div id="midi-panel">
        <button type="button" class="button button-primary" id="connect">Enable MIDI</button>

        <label class="field">
          <span>Output</span>
          <select id="midi-output"></select>
        </label>
        <label class="field">
          <span>Input</span>
          <select id="midi-input"></select>
        </label>
        <div class="field-row">
          <label class="field">
            <span>Channel</span>
            <input id="channel" type="number" min="1" max="16" value="1">
          </label>
          <label class="field">
            <span id="slot-label">Slot</span>
            <select id="slot"></select>
          </label>
        </div>
        <p class="hint">If two NTS-1 ports appear, use the last one.</p>
        <button type="button" class="button button-secondary" id="send">Send to slot</button>
      </div>

      <div class="log-wrap">
        <h3>Log</h3>
        <div id="log" class="log" role="log" aria-live="polite"></div>
      </div>
    </section>

    <section class="panel units" aria-labelledby="units-heading">
      <div class="panel__label">Units</div>
      <h2 id="units-heading">Units</h2>
      <div id="plugin-list" class="plugin-list"></div>
    </section>
  </main>

  <script src="./coi-serviceworker.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
