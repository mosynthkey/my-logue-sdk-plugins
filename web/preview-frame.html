<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Preview</title>
  <script>
    window.coi = {
      coepCredentialless: () => true,
      coepDegrade: () => false,
      quiet: true,
    };
  </script>
  <script src="./coi-serviceworker.js"></script>
  <link rel="stylesheet" href="./styles.css">
  <script src="./vendor/qwerty-hancock.js"></script>
</head>
<body class="preview-frame">
  <p id="preview-status" class="preview-status">Loading preview…</p>
  <div id="preview-instrument" class="preview-instrument" hidden></div>
  <div id="preview-knobs" class="preview-knobs" hidden></div>
  <script type="module">
    import { runPreviewHost } from "./preview.js";

    const params = new URLSearchParams(location.search);
    const build = JSON.parse(params.get("build") || "null");
    const plugin = JSON.parse(params.get("plugin") || "null");
    runPreviewHost(build, plugin);
  </script>
</body>
</html>
